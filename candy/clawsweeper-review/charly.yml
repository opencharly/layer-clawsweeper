clawsweeper-review:
    candy:
        description: |
            The ClawSweeper review engine as a runnable artefact: a PINNED upstream checkout,
            Node 24 + pnpm 12.4.1, the OpenAI Codex CLI (the engine's only runner), a
            CODEX_HOME configured for the OpenCharly Ollama Cloud endpoint, and an
            `opencharly` target-profile overlay so any opencharly/<repo> resolves.

            This image is the REVIEW HALF of PR validation. It is run as a disposable
            container with the PR tree mounted read-only and NO GitHub token: `--local-range`
            reads merge-base(base, HEAD)..HEAD and performs no GitHub writes, so the verdict
            leaves the sandbox as JSON and the caller posts it. Codex's sandbox needs
            bubblewrap and unprivileged user namespaces; the runner image enables those.

            The engine/endpoint pairing is MEASURED, not assumed: Codex 0.162.1 speaks
            stateless Responses to https://ollama.com/v1 and performs real shell tool calls
            (probe: `codex exec` ran `uname -s && uname -m`, returned Linux/x86_64). Codex
            accepts only `wire_api = "responses"`; Ollama Cloud serves that.
        # The model key is RUN-TIME only: the image names the env var, never a value. A deploy
        # of an image composed from this candy resolves it through the credential store.
        secret_accept:
            - name: OLLAMA_API_KEY
              description: "Ollama Cloud API key for the review model; supplied at run time, never baked into the image."
              key: charly/api-key/ollama
        distro:
            ubuntu:
                package:
                    - git
                    - curl
                    - ca-certificates
                    - xz-utils
                    - jq
                    - python3
                    - bubblewrap
                    - libicu74
                    - libssl3t64
        var:
            # Pinned upstream commit (the org's vendored clawsweeper). Advance producer-first:
            # upstream merge -> this pin -> the image.
            CLAWSWEEPER_COMMIT: 1fa8e7d22d3341d060ddafa521c4355607bed728
            NODE_VERSION: 24.22.1
            CODEX_VERSION: 0.162.1
            PNPM_VERSION: 12.4.1
        plan:
            - run: "install the pinned Node runtime from the official tarball"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  V="${NODE_VERSION}"
                  curl -fsSL "https://nodejs.org/dist/v${V}/node-v${V}-linux-x64.tar.xz" -o /tmp/node.tar.xz
                  tar -xJf /tmp/node.tar.xz -C /opt
                  ln -sfn "/opt/node-v${V}-linux-x64" /opt/node
                  for b in node npm npx corepack; do ln -sf "/opt/node/bin/$b" "/usr/local/bin/$b"; done
            # pnpm comes from npm, NOT corepack. Corepack answers with its own "known good"
            # version whenever it is invoked outside a tree that declares `packageManager` —
            # measured: `pnpm --version` in `/` reported 12.15.0 and DOWNLOADED it at run time,
            # while `/opt/clawsweeper/package.json` pins 12.4.1. That made the "pnpm 12.4.1"
            # claim false everywhere outside the checkout and added a network dependency to a
            # command that must be offline. A real npm-installed pnpm is version-stable wherever
            # it runs and needs no download.
            - run: "install the pinned pnpm and the pinned Codex CLI"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  npm install --global "pnpm@${PNPM_VERSION}" "@openai/codex@${CODEX_VERSION}"
                  # npm's global bin lives in the Node tree, which is NOT on PATH; the two
                  # binaries the image advertises must be reachable by name. `codex` was the
                  # missing one — measured: `codex: command not found` at check time while
                  # /opt/node/bin/codex existed.
                  for b in pnpm codex; do ln -sf "/opt/node/bin/$b" "/usr/local/bin/$b"; done
            - run: "clone the pinned ClawSweeper checkout and build it"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  rm -rf /opt/clawsweeper
                  git clone --quiet https://github.com/opencharly/clawsweeper.git /opt/clawsweeper
                  git -C /opt/clawsweeper checkout --quiet "${CLAWSWEEPER_COMMIT}"
                  cd /opt/clawsweeper
                  pnpm install --frozen-lockfile
                  pnpm run build
                  # The review runs from dist/ only; dev dependencies are build-time.
                  pnpm prune --prod
            - run: "add the opencharly target-profile fallback so any opencharly/<repo> resolves"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json
                  path = "/opt/clawsweeper/config/target-repositories.json"
                  data = json.load(open(path))
                  owner = "opencharly"
                  fallbacks = data.setdefault("generic_fallbacks", [])
                  if not any(f.get("owner") == owner for f in fallbacks):
                      fallbacks.append({
                          "owner": owner,
                          "deny_repositories": [],
                          # REQUIRED, not decoration: the engine validates every fallback's
                          # allow_repo_name_pattern as a string and throws on the whole file
                          # without it ("generic_fallbacks[2].allow_repo_name_pattern must be a
                          # string") — measured on this image, where the engine would not start at
                          # all. Kept identical to the two upstream entries.
                          "allow_repo_name_pattern": "^[A-Za-z0-9_.-]+$",
                          "package_manager": "npm",
                          "prompt_note": (
                              "Review the repository's source tree and current default branch with "
                              "target-native tooling and evidence. Read the root AGENTS.md and any "
                              "ancestor AGENTS.md before judging."
                          ),
                          "apply_close_rules": {"issue": [], "pull_request": []},
                      })
                  json.dump(data, open(path, "w"), indent=2)
                  print("opencharly fallback present")
                  PY
            - run: "write the Codex home configured for the Ollama Cloud endpoint"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  install -d -m 0755 /etc/clawsweeper
                  cat > "${CODEX_HOME:-/etc/clawsweeper}/config.toml" <<'TOML'
                  model = "deepseek-v4.1-flash"
                  model_reasoning_effort = "low"
                  model_provider = "ollama-cloud"

                  [model_providers.ollama-cloud]
                  name = "Ollama Cloud"
                  base_url = "https://ollama.com/v1"
                  env_key = "OLLAMA_API_KEY"
                  wire_api = "responses"
                  requires_openai_auth = false
                  TOML
            - run: "install the one-shot review entrypoint"
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  cat > /usr/local/bin/clawsweeper-review <<'SH'
                  #!/usr/bin/env bash
                  # One review of the tree mounted at /target against the base ref in BASE_SHA.
                  # --local-range reads merge-base(base, HEAD)..HEAD, refuses a dirty tree, and
                  # makes NO GitHub reads or writes, so no token is needed or accepted here.
                  set -euo pipefail
                  # --help FIRST: a usage request must not require configuration.
                  if [ "${1:-}" = "--help" ]; then
                    echo "usage: clawsweeper-review  (env: CLAWSWEEPER_TARGET_REPO, BASE_SHA, OLLAMA_API_KEY, TARGET_DIR)"
                    echo "runs: node dist/clawsweeper.js review --local-range --target-repo <repo> --target-dir <dir> --base <sha> --result-format json --output-retention summary"
                    exit 0
                  fi
                  : "${CLAWSWEEPER_TARGET_REPO:?CLAWSWEEPER_TARGET_REPO is required}"
                  : "${BASE_SHA:?BASE_SHA is required}"
                  # CODEX_HOME MUST BE WRITABLE. Codex keeps its app-server state there, and
                  # this image runs as uid 1000 while /etc/clawsweeper is root-owned 0755 —
                  # measured: every review died with "failed to initialize in-process
                  # app-server client: Permission denied (os error 13)", before the model was
                  # ever reached. The image file stays the ONE source of truth; the runtime
                  # home is a per-user copy of it.
                  # A DIRECTORY is required, not merely a writable path: a writable FILE at
                  # CODEX_HOME would satisfy a bare -w test and then break Codex.
                  if [ -z "${CODEX_HOME:-}" ] || [ ! -d "${CODEX_HOME}" ] || [ ! -w "${CODEX_HOME}" ]; then
                    CODEX_HOME="${HOME:-/tmp}/.codex"
                    export CODEX_HOME
                  fi
                  # Seed UNCONDITIONALLY when the file is absent, not only in the redirect
                  # branch: a caller who exports a writable but empty CODEX_HOME would
                  # otherwise run Codex with no endpoint and no wire_api.
                  mkdir -p "${CODEX_HOME}"
                  [ -f "${CODEX_HOME}/config.toml" ] || cp /etc/clawsweeper/config.toml "${CODEX_HOME}/config.toml"
                  cd /opt/clawsweeper
                  exec node dist/clawsweeper.js review --local-range \
                    --target-repo "${CLAWSWEEPER_TARGET_REPO}" \
                    --target-dir "${TARGET_DIR:-/target}" \
                    --base "${BASE_SHA}" \
                    --result-format json \
                    --output-retention summary
                  SH
                  chmod 0755 /usr/local/bin/clawsweeper-review
            - check: Node 24 reports its version
              id: check-node
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  node --version
              stdout:
                  contains: "v24."
            - check: pnpm reports the pinned version
              id: check-pnpm
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  pnpm --version
              stdout:
                  contains: "12.4.1"
            - check: the Codex CLI reports the pinned version
              id: check-codex
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  codex --version
              stdout:
                  contains: "0.162.1"
            # NOT `dist/clawsweeper.js --help`: the engine has NO help path — it validates a
            # hosted-review invocation instead and exits non-zero for EVERY bare call, so the
            # old check could never pass (measured: `--help`, `review --help` and no-args all
            # print the same "Hosted review requires --output-retention debug …" error).
            # What the check must prove is that the BUILT tree loads and the profile overlay
            # resolves — the two things that actually broke here. Importing the profile module
            # is exactly what threw on the malformed overlay.
            - check: the built engine loads and resolves an opencharly target through the overlay
              id: check-engine
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  test -s /opt/clawsweeper/dist/clawsweeper.js
                  node --input-type=module -e '
                  const m = await import("/opt/clawsweeper/dist/repository-profiles.js");
                  const p = m.repositoryProfileFor("opencharly/fixture");
                  if (p.packageManager !== "npm") {
                    throw new Error("opencharly profile did not resolve: " + JSON.stringify(p).slice(0, 200));
                  }
                  console.log("profile-ok " + p.slug);
                  '
            - check: the opencharly target fallback is present
              id: check-profile
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  jq -e '.generic_fallbacks[] | select(.owner == "opencharly")' \
                    /opt/clawsweeper/config/target-repositories.json >/dev/null
            # Codex reads $CODEX_HOME/config.toml — the exact path, not a lookalike name.
            - check: the Codex home carries config.toml naming the Ollama Cloud responses endpoint
              id: check-codex-config
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  test -f /etc/clawsweeper/config.toml
                  grep -qx 'base_url = "https://ollama.com/v1"' /etc/clawsweeper/config.toml
                  grep -qx 'wire_api = "responses"' /etc/clawsweeper/config.toml
            # RUNTIME context on purpose: the read-only /etc/clawsweeper only bites the image's
            # OWN user (uid 1000), and a build-time check runs as root where everything is
            # writable — so a build-scoped assertion could never see this. It needs no key:
            # Codex stops at the auth boundary, which is exactly the signal wanted.
            - check: the entrypoint gives Codex a writable home as the image's own user
              id: check-codex-runtime
              run_as: "${USER}"
              context: [runtime]
              command: |
                  set -euo pipefail
                  # A one-commit fixture whose BASE IS HEAD: nothing to review, so the engine
                  # stops before the model. This check is about the HOME, not a verdict, and it
                  # must behave identically whether or not a key is injected — no billed call,
                  # no key-shaped assertion.
                  rm -rf /tmp/noop && mkdir -p /tmp/noop
                  git init -q -b main /tmp/noop
                  git -C /tmp/noop config user.email fixture@example.invalid
                  git -C /tmp/noop config user.name fixture
                  printf 'a\n' > /tmp/noop/x
                  git -C /tmp/noop add x && git -C /tmp/noop commit -qm one
                  head="$(git -C /tmp/noop rev-parse HEAD)"

                  # Drive the ENTRYPOINT with CODEX_HOME UNSET. The redirect under test is the
                  # entrypoint's own — seeding a home here would test a copy of it and would
                  # pass even with the entrypoint still pointing at root-owned
                  # /etc/clawsweeper (which is exactly how the defect shipped).
                  rm -rf "${HOME}/.codex"
                  out="$(unset CODEX_HOME; CLAWSWEEPER_TARGET_REPO=opencharly/fixture \
                    BASE_SHA="$head" TARGET_DIR=/tmp/noop timeout 300 clawsweeper-review 2>&1 || true)"
                  printf '%s\n' "$out" | tail -3

                  # THE INVARIANT: the entrypoint redirected to a per-user home seeded from the
                  # image config, and it is writable by THIS user. On the shipped defect no file
                  # was created here and Codex died on
                  # "failed to initialize in-process app-server client: Permission denied".
                  test -s "${HOME}/.codex/config.toml"
                  test -w "${HOME}/.codex"
                  if printf '%s\n' "$out" | grep -q 'Permission denied'; then
                    echo "the engine died on the image's own permissions"
                    exit 1
                  fi
                  echo CODEX-HOME-WRITABLE-AS-USER
            # Exercise the entrypoint itself, so the flag surface it passes is asserted at build
            # time; the full model round-trip is the consumer bed's job (it needs a key).
            - check: the one-shot review entrypoint runs and describes its invocation
              id: check-entrypoint
              run_as: root
              context: [build]
              command: |
                  set -euo pipefail
                  test -x /usr/local/bin/clawsweeper-review
                  out="$(/usr/local/bin/clawsweeper-review --help)"
                  printf '%s\n' "$out" | grep -q -- '--local-range'
                  printf '%s\n' "$out" | grep -q -- '--result-format json'
            # THE INPUT SCANNER MUST BE BAKED. The engine refuses every review with
            # "Agent input scan refused: scanner_unavailable" when it cannot resolve its
            # TruffleHog. The bootstrap downloads it on demand — so an image that never
            # installs it depends on egress at REVIEW time and fails closed when that path is
            # unavailable, which is exactly what happened on the runner (crabbox@16): the
            # review ran, then refused its own input.
            #
            # It is installed AS THE IMAGE USER into that user's own cache: the bootstrap
            # rejects a cache that is not private to the caller ("Trusted scanner cache is not
            # private to the current user"), so a root-installed tree cannot be used.
            - run: "pre-install the engine's input scanner into the image user's cache"
              run_as: "${USER}"
              context: [build]
              command: |
                  set -euo pipefail
                  cd /opt/clawsweeper
                  node scripts/setup-review-tools.mjs --timeout-ms 300000
            - check: the input scanner is baked into THIS user's private cache
              id: check-input-scanner
              run_as: "${USER}"
              context: [build]
              command: |
                  set -euo pipefail
                  # Do NOT go through scripts/setup-review-tools.mjs here: that helper
                  # DOWNLOADS on demand, so a check that calls it passes whether or not the
                  # image baked anything. This inspects the cache the build was supposed to
                  # produce, so an un-baked image fails.
                  root="${HOME}/.clawsweeper-review-tools"
                  test -d "$root"
                  scanner="$(find "$root" -type f -name trufflehog -perm -u+x | head -1)"
                  test -n "$scanner"
                  test -x "$scanner"
                  # The bake and this check must run as the IMAGE user, never root: if
                  # `run_as: "${USER}"` ever resolved to the build process's root user, the
                  # cache would live in /root and no review could use it.
                  echo "check user: $(id -un) uid=$(id -u) home=${HOME}"
                  test "$(id -u)" -ne 0
                  test "$(id -un)" = "$(stat -c %U "$HOME")"
                  test "$(id -un)" = "$(stat -c %U "$root")"
                  test "$(stat -c %a "$root")" = "700"
                  "$scanner" --version

clawsweeper-review-skill:
    skill:
        name: clawsweeper-review
        family: check
        owner: clawsweeper-review
        description: |-
            The ClawSweeper review engine as a disposable container: pinned upstream, Codex on the
            Ollama Cloud endpoint, the opencharly target profile, and a no-token `--local-range`
            review whose JSON verdict the caller posts.
